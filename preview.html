<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Big Desktop Clock</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      display: grid;
      place-items: center;
      color: #f7f9ff;
      background:
        radial-gradient(circle at 50% 35%, rgba(51, 94, 170, .22), transparent 38%),
        linear-gradient(145deg, #070a10 0%, #101726 55%, #07090e 100%);
      font-family: "Segoe UI", Inter, system-ui, sans-serif;
      font-variant-numeric: tabular-nums;
    }
    main { width: min(92vw, 1500px); text-align: center; user-select: none; }
    #time {
      font-size: clamp(120px, 25vw, 420px);
      font-weight: 750;
      letter-spacing: -.075em;
      line-height: .82;
      text-shadow: 0 8px 55px rgba(61, 139, 255, .23);
    }
    #seconds {
      margin-left: .08em;
      color: #66a9ff;
      font-size: .25em;
      letter-spacing: 0;
      vertical-align: .48em;
    }
    #period {
      margin-left: .18em;
      color: rgba(247, 249, 255, .72);
      font-size: .16em;
      font-weight: 650;
      letter-spacing: .08em;
      vertical-align: .52em;
    }
    #date {
      margin-top: clamp(30px, 5vh, 70px);
      color: rgba(247, 249, 255, .78);
      font-size: clamp(24px, 3.3vw, 58px);
      font-weight: 420;
      letter-spacing: .04em;
    }
    .identity {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      margin-top: clamp(22px, 3.2vh, 44px);
      filter: drop-shadow(0 0 22px rgba(84, 153, 255, .25));
    }
    #name {
      position: relative;
      overflow: hidden;
      color: transparent;
      background: linear-gradient(100deg, #74c7ff 0%, #a478ff 45%, #f2f7ff 55%, #74c7ff 100%);
      background-size: 240% 100%;
      background-clip: text;
      -webkit-background-clip: text;
      font-size: clamp(36px, 5vw, 82px);
      font-weight: 850;
      letter-spacing: .22em;
      line-height: 1;
      text-indent: .22em;
      animation: name-shine 5s linear infinite, name-pulse 2.8s ease-in-out infinite;
    }
    #tagline {
      margin-top: 14px;
      color: rgba(235, 241, 255, .62);
      font-size: clamp(15px, 1.55vw, 25px);
      font-weight: 500;
      letter-spacing: .09em;
    }
    #tagline::before, #tagline::after {
      color: #69aaff;
      content: "//";
      margin: 0 .8em;
      opacity: .65;
    }
    .track {
      width: min(70vw, 900px);
      height: 7px;
      margin: clamp(28px, 5vh, 60px) auto 0;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255, 255, 255, .10);
    }
    #progress {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #3e7dff, #72c5ff);
      box-shadow: 0 0 18px rgba(81, 155, 255, .65);
      transition: width .5s linear;
    }
    #label {
      margin-top: 12px;
      color: rgba(247, 249, 255, .42);
      font-size: clamp(13px, 1.2vw, 18px);
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    @keyframes name-shine {
      to { background-position: -240% 0; }
    }
    @keyframes name-pulse {
      0%, 100% { filter: brightness(.9); text-shadow: 0 0 16px rgba(70, 137, 255, .25); }
      50% { filter: brightness(1.25); text-shadow: 0 0 34px rgba(120, 101, 255, .55); }
    }
    @media (max-height: 760px) {
      #time { font-size: clamp(100px, 21vw, 300px); }
      #date { margin-top: 28px; }
      .identity { margin-top: 20px; }
      .track { margin-top: 28px; }
    }
  </style>
</head>
<body>
  <main aria-label="Current time">
    <div id="time"><span id="hours">00</span>:<span id="minutes">00</span><span id="seconds">00</span><span id="period">AM</span></div>
    <div id="date"></div>
    <div class="identity">
      <div id="name">SHAM3R</div>
      <div id="tagline">Full-time gamer. Part-time developer. Baki Time Tomader sobar! 🤡</div>
    </div>
    <div class="track"><div id="progress"></div></div>
    <div id="label">Day progress · <span id="percentage">0.0%</span></div>
  </main>
  <script>
    const two = value => String(value).padStart(2, "0");
    function updateClock() {
      const now = new Date();
      const hour24 = now.getHours();
      const hour12 = hour24 % 12 || 12;
      document.querySelector("#hours").textContent = two(hour12);
      document.querySelector("#minutes").textContent = two(now.getMinutes());
      document.querySelector("#seconds").textContent = two(now.getSeconds());
      document.querySelector("#period").textContent = hour24 >= 12 ? "PM" : "AM";
      document.querySelector("#date").textContent = new Intl.DateTimeFormat(undefined, {
        weekday: "long", day: "numeric", month: "long", year: "numeric"
      }).format(now);
      const elapsed = hour24 * 3600 + now.getMinutes() * 60 + now.getSeconds() + now.getMilliseconds() / 1000;
      const dayProgress = elapsed / 86400 * 100;
      document.querySelector("#progress").style.width = `${dayProgress}%`;
      document.querySelector("#percentage").textContent = `${dayProgress.toFixed(1)}%`;
    }
    updateClock();
    setInterval(updateClock, 250);
  </script>
</body>
</html>
